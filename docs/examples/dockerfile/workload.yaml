apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-java
spec:
  replicas: 2
  selector:
    matchLabels: {app: synthetic-java}
  template:
    metadata:
      labels: {app: synthetic-java}
    spec:
      containers:
        - name: app
          image: example.invalid/synthetic-java:review-only
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
