# Synthetic local review fixture; no cluster connection or deployment.
apiVersion: v1
kind: Pod
metadata:
  name: legacy-ingress-example
  namespace: review
spec:
  containers:
  - name: controller
    image: k8s.gcr.io/ingress-nginx/controller:v1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: mirror-example
  namespace: review
spec:
  containers:
  - name: controller
    image: private.example/ingress-nginx/controller:review
---
apiVersion: v1
kind: Node
metadata:
  name: old-os-example
status:
  nodeInfo:
    osImage: Ubuntu 20.04.6 LTS
