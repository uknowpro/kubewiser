# Synthetic review input, never deployed by kubewiser.
apiVersion: v1
kind: Pod
metadata:
  name: legacy-agent-example
  namespace: review
spec:
  containers:
  - name: agent
    image: example.invalid/agent:proposed-v2
    args: ['cat /host-cgroup/memory.max']
    volumeMounts:
    - name: cgroup
      mountPath: /host-cgroup
      readOnly: true
  volumes:
  - name: cgroup
    hostPath:
      path: /sys/fs/cgroup
      type: Directory
