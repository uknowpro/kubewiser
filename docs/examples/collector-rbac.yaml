# Review the namespace and bind this Role to your existing approved identity.
# No binding or ServiceAccount token is created by this example.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubewiser-reader
  namespace: REPLACE_NAMESPACE
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
# Optional only for --include-cluster-resources; review and bind separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubewiser-node-storage-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
