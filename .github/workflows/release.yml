name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o kubewiser ./cmd/kubewiser
      - run: ./kubewiser --version
  package:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Package all platforms
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_TAG"
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "dist/$RELEASE_TAG"
          sha256sum -c checksums.txt
          tar -xzf "kubewiser_${RELEASE_TAG}_linux_amd64.tar.gz" kubewiser
          ./kubewiser --version
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.tar.gz checksums.txt build-info.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes "${args[@]}"
