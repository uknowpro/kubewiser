name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o kubewiser ./cmd/kubewiser
      - run: ./kubewiser --version
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - run: go test ./...
      - run: go vet ./...
      - name: Build standalone Windows executable
        env:
          CGO_ENABLED: '0'
        run: go build -o kubewiser.exe ./cmd/kubewiser
      - name: PowerShell smoke test
        shell: pwsh
        run: |
          ./kubewiser.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version command failed' }
          $folder = Join-Path $env:RUNNER_TEMP 'kubewiser 한글 경로'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $file = Join-Path $folder 'manifest.yaml'
          "apiVersion: batch/v1beta1`nkind: CronJob" | Set-Content -Encoding utf8 $file
          $output = & ./kubewiser.exe scan files --target-version 1.32 --format json $file
          if ($LASTEXITCODE -ne 1) { throw 'Expected findings exit code 1' }
          $report = $output | ConvertFrom-Json
          if ($report.findings[0].rule_id -ne 'KW-API-REMOVED') { throw 'Missing API removal finding' }
          exit 0
  package:
    needs: [test, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Package all platforms
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release.sh "$RELEASE_TAG"
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "dist/$RELEASE_TAG"
          sha256sum -c checksums.txt
          tar -xzf "kubewiser_${RELEASE_TAG}_linux_amd64.tar.gz" kubewiser
          ./kubewiser --version
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip checksums.txt build-info.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file "$GITHUB_WORKSPACE/docs/release-notes/$RELEASE_TAG.md" "${args[@]}"
