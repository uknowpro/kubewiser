name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o kubewiser ./cmd/kubewiser
      - run: ./kubewiser --version
      - run: CGO_ENABLED=0 go build -o kubewise ./cmd/kubewise
      - run: ./kubewise --version
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - run: go test ./...
      - run: go vet ./...
      - name: Build standalone Windows executable
        env:
          CGO_ENABLED: '0'
        run: go build -o kubewiser.exe ./cmd/kubewiser
      - name: PowerShell smoke test
        shell: pwsh
        run: |
          ./kubewiser.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version command failed' }
          $folder = Join-Path $env:RUNNER_TEMP 'kubewiser 한글 경로'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $file = Join-Path $folder 'manifest.yaml'
          "apiVersion: batch/v1beta1`nkind: CronJob" | Set-Content -Encoding utf8 $file
          $output = & ./kubewiser.exe scan files --target-version 1.32 --format json $file
          if ($LASTEXITCODE -ne 1) { throw 'Expected findings exit code 1' }
          $report = $output | ConvertFrom-Json
          if ($report.findings[0].rule_id -ne 'KW-API-REMOVED') { throw 'Missing API removal finding' }
          Set-Alias -Name kubewise -Value (Resolve-Path ./kubewiser.exe).Path
          $aliasOutput = & kubewise scan files --target-version 1.32 --format json $file
          if ($LASTEXITCODE -ne 1) { throw 'Alias exit code mismatch' }
          if (($output -join "`n") -ne ($aliasOutput -join "`n")) { throw 'Alias output mismatch' }
          kubewise --version
          if ($LASTEXITCODE -ne 0) { throw 'Alias version command failed' }
          exit 0
      - name: Automatic command registration (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $oldPath = [Environment]::GetEnvironmentVariable('Path','User')
          try {
            $destination = Join-Path $env:RUNNER_TEMP 'kubewiser-install'
            & ./scripts/install-windows.ps1 -BinaryPath ./kubewiser.exe -InstallDir $destination
            & ./scripts/install-windows.ps1 -BinaryPath ./kubewiser.exe -InstallDir $destination
            foreach ($name in @('kubewiser','kubewise')) {
              $command = Get-Command $name -CommandType Application
              if ((Split-Path $command.Source) -ne $destination) { throw 'Command resolves outside install directory' }
              & $name --version
              if ($LASTEXITCODE -ne 0) { throw 'Registered command failed' }
            }
            $a = & cmd /d /c 'kubewiser --version'
            if ($LASTEXITCODE -ne 0) { throw 'CMD kubewiser failed' }
            $b = & cmd /d /c 'kubewise --version'
            if ($LASTEXITCODE -ne 0 -or $a -ne $b) { throw 'CMD commands differ' }
            # Unrelated files must never be overwritten.
            $conflict = Join-Path $env:RUNNER_TEMP 'kubewiser-conflict'
            New-Item -ItemType Directory -Force $conflict | Out-Null
            $conflictFile = Join-Path $conflict 'kubewise.exe'
            'keep me' | Set-Content $conflictFile
            $before = (Get-FileHash $conflictFile).Hash
            $rejected = $false
            try { & ./scripts/install-windows.ps1 -BinaryPath ./kubewiser.exe -InstallDir $conflict } catch { $rejected = $true }
            if (-not $rejected -or (Get-FileHash $conflictFile).Hash -ne $before) { throw 'Conflict handling failed' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path',$oldPath,'User')
          }
          exit 0
